# config.yml 文件示例
key-settings:
  # 鑰匙使用冷卻時間（秒）
  # 預設值：180 (3分鐘)
  cooldown-seconds: 2
settings:
  exit-point: "world,0,64,0,0,0"
  revival-system-enabled: true
  debug: false
ranking:
  hologram-update-interval: 5 # 自動更新間隔（秒）
# 組隊系統設定
party:
  # 選擇組隊系統類型: "custom" 或 "mmocore"
  system-type: "custom"
wave-dungeon:
  force-next-wave-countdown: 300
  sounds:
    countdown: "BLOCK_NOTE_BLOCK_PLING"
    wave-start: "ENTITY_ENDER_DRAGON_GROWL"
    wave-clear: "ENTITY_PLAYER_LEVELUP"
    dungeon-complete: "UI_TOAST_CHALLENGE_COMPLETE"
    force-next-wave: "BLOCK_ANVIL_LAND"  # 新增：強制下一波音效
  sound-options:
    volume: 1.0
    pitch: 1.0
    countdown-pitch: 1.2
    force-next-wave-pitch: 0.8  # 新增：強制下一波音效的音調
mob-scaling:
  # 普通怪物數量倍率（根據玩家數量）
  normal-multipliers:
    "1": 1.0    # 1人時，怪物數量 × 1.0
    "2": 2.0    # 2人時，怪物數量 × 2.0
    "3": 3.0    # 3人時，怪物數量 × 3.0
    "4": 4.0    # 4人時，怪物數量 × 4.0

  # BOSS等級加成（根據玩家數量）
  boss-level-bonus:
    "1": 0      # 1人時，BOSS等級 +0
    "2": 5      # 2人時，BOSS等級 +5
    "3": 10     # 3人時，BOSS等級 +10
    "4": 15     # 4人時，BOSS等級 +15
dungeons:
  # 普通副本示例
  dungeon_normal_1:
    type: "normal"
    level-required: 0
    max-players: 4
    spawn-point: "world,100,64,100,0,0"
    death-waiting-area: "world,110,64,110,0,0"
    target-mob: "boss_goblin_king"
    mobs:
      - id: "dungeon_goblin"
        location: "world,120,64,120,0,0"
      - id: "dungeon_goblin"
        location: "world,125,64,125,0,0"
      - id: "dungeon_goblin_elite"
        location: "world,130,64,130,0,0"
      - id: "boss_goblin_king"
        location: "world,140,64,140,0,0"

  # 波次副本示例
  dungeon_wave_1:
    type: "wave"
    level-required: 10
    max-players: 5
    display-name: "<green>hello world</green><#ff0000>❤</#ff0000>"
    spawn-point: "world,200,64,200,0,0"
    death-waiting-area: "world,210,64,210,0,0"
    target-mob: "boss_dragon"  # 最终Boss (如果有的话)
    # 初始怪物，可选
    mobs:
      - id: "dungeon_guide"
        location: "world,205,64,205,0,0"
    # 波次配置
    waves:
      total: 3  # 总波数
      # 第一波怪物
      wave-1:
        - id: "dungeon_skeleton"
          location: "world,220,64,220,0,0"
        - id: "dungeon_skeleton"
          location: "world,225,64,225,0,0"
        - id: "dungeon_skeleton"
          location: "world,230,64,230,0,0"
      # 第二波怪物
      wave-2:
        - id: "dungeon_zombie"
          location: "world,240,64,240,0,0"
        - id: "dungeon_zombie"
          location: "world,245,64,245,0,0"
        - id: "dungeon_zombie_elite"
          location: "world,250,64,250,0,0"
        - id: "dungeon_zombie_elite"
          location: "world,255,64,255,0,0"
      # 第三波怪物 (最后一波)
      wave-3:
        - id: "dungeon_skeleton_elite"
          location: "world,260,64,260,0,0"
        - id: "dungeon_zombie_elite"
          location: "world,265,64,265,0,0"
        - id: "boss_dragon"  # 最终Boss
          location: "world,270,64,270,0,0"

  # 另一个波次副本示例 (只有波次，没有最终Boss)
  dungeon_wave_survival:
    type: "wave"
    level-required: 20
    max-players: 4
    spawn-point: "world,-100,64,-100,0,0"
    death-waiting-area: "world,-110,64,-110,0,0"
    waves:
      total: 3  # 总波数
      # 第一波
      wave-1:
        - amount: 3
          level: 2
          location: test,2475.80,135.00,-2280.62
          id: Goblin_Warrior
          radius: 5.0
          type: NORMAL
      # 第二波
      wave-2:
        - amount: 3
          level: 2
          location: test,2475.80,135.00,-2280.62
          id: Goblin_Warrior
          radius: 5.0
          type: NORMAL
      # 第三波
      wave-3:
        - amount: 3
          level: 2
          location: test,2475.80,135.00,-2280.62
          id: Goblin_Warrior
          radius: 5.0
          type: NORMAL
        - amount: 1
          level: 1
          location: test,2475.94,135.00,-2281.59
          id: Orc_King
          radius: 5.0
          type: BOSS